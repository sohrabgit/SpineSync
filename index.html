<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1015" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="SpineSync — your 30-day cervical disc recovery and ergonomics companion." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SpineSync" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Vazirmatn:wght@400;500;600;700&display=swap" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>SpineSync</title>
    <style>
      /* Launch splash: shown before JS loads, removed by src/lib/splash.ts. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0e1015;
        transition: opacity 300ms ease-out;
      }
      #splash.splash-out {
        opacity: 0;
        pointer-events: none;
      }
      #splash svg {
        width: 88px;
        height: 88px;
        animation: splash-breathe 2.4s ease-in-out 700ms infinite;
      }
      #splash .v {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: splash-rise 420ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      #splash .v:nth-child(4) { animation-delay: 60ms; }
      #splash .v:nth-child(3) { animation-delay: 140ms; }
      #splash .v:nth-child(2) { animation-delay: 220ms; }
      #splash .v:nth-child(1) { animation-delay: 300ms; }
      #splash p {
        margin: 0;
        font: 700 22px/1 "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        letter-spacing: -0.01em;
        color: #eceef3;
        opacity: 0;
        animation: splash-fade 400ms ease-out 380ms forwards;
      }
      @keyframes splash-rise {
        from { opacity: 0; transform: translateY(8px) scale(0.9); }
        to { opacity: var(--o, 1); transform: none; }
      }
      @keyframes splash-fade {
        to { opacity: 1; }
      }
      @keyframes splash-breathe {
        0%, 100% { transform: none; }
        50% { transform: scale(1.04); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash svg, #splash .v, #splash p {
          animation: none;
          opacity: var(--o, 1);
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 64 64">
        <rect width="64" height="64" rx="16" fill="#171a22" />
        <g fill="#5cc8b0">
          <rect class="v" style="--o: 0.55" x="24" y="10" width="16" height="8" rx="4" />
          <rect class="v" style="--o: 0.7" x="23" y="21" width="18" height="8" rx="4" />
          <rect class="v" style="--o: 0.85" x="22" y="32" width="20" height="8" rx="4" />
          <rect class="v" x="21" y="43" width="22" height="9" rx="4.5" />
        </g>
      </svg>
      <p>SpineSync</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
